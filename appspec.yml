version: 0.0
os: linux
file_exists_behavior: OVERWRITE

files:
  - source: DeviceLoopBackend
    destination: /opt/deviceloop-backend/DeviceLoopBackend

  - source: requirements.txt
    destination: /opt/deviceloop-backend

  - source: runserver.py
    destination: /opt/deviceloop-backend

  - source: scripts
    destination: /opt/deviceloop-backend/scripts

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 300
      runas: root

  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/application_start.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 300
      runas: root
