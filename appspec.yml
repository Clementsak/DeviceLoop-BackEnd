version: 0.0
os: linux

files:
  - source: /
    destination: /opt/deviceloop-backend
    overwrite: true

hooks:
  BeforeInstall:
    - location: before_install.sh
      timeout: 300
      runas: root

  AfterInstall:
    - location: after_install.sh
      timeout: 900
      runas: root

  ApplicationStart:
    - location: application_start.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: validate_service.sh
      timeout: 300
      runas: root
